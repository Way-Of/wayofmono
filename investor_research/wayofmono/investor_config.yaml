project_name: "WayOfMono"
project_tagline: "The Universal AI Coding Agent Harness — One intelligence backend, any agent frontend"
project_description: >
  WayOfMono is the ultimate monorepo consolidation for high-performance AI coding agents.
  It solves the fragmentation in the AI developer tools market by providing a shared Intelligence
  Backend (13 NPM packages, 81 battle-tested skills, 6 subagents, context engineering workflow)
  that serves 7 distinct Agent Frontends (wocode, wouser, Claude Code, OpenCode, Gemini CLI,
  Pi, Codex, Antigravity). Built on an Interface-Agnostic Philosophy, WayOfMono enables
  teams to use any AI coding tool with shared skills, configurations, and memory — eliminating
  vendor lock-in and tool fragmentation.

problem_statement: >
  The AI developer tools market has exploded — 7+ major AI coding tools, each with its own
  configuration, skills, and memory. Developers use 2-3 tools on average (53% use 2+), but
  there's no standardized way to share skills, agents, and configurations across them.
  Teams face vendor lock-in, duplicated effort, no cross-tool governance, and no observability
  into how AI tools are actually being used across the organization.

problem_details:
  - "53% of developers use 2+ AI coding tools — but none share configs or skills across them"
  - "Enterprise teams have no visibility into which AI tools developers are using or how effectively"
  - "Vendor lock-in: switching AI coding tools means rebuilding all skills, configs, and workflows"
  - "No standardized context management — each session starts from scratch with no memory"
  - "Skills and agent configurations are duplicated across every developer's machine"

solution_description: >
  WayOfMono provides a universal AI harness that sits above all AI coding tools. It installs
  shared skills, agents, commands, and configurations across 7+ AI coding tools from a single
  source of truth. The CTO Dashboard gives teams real-time visibility into tool adoption and
  skill health. The f-rr-d context engineering system provides end-to-end workflow from ticket
  creation through implementation and validation.

solution_highlights:
  - "Single command installs 81 skills across all 7 tools simultaneously"
  - "CTO Dashboard with real-time skill health, ticket management, and review queue"
  - "Multi-provider LLM abstraction (30+ providers) — no vendor lock-in"
  - "Local-first with Ollama — full privacy, offline capable"
  - "Context engineering (f-rr-d): tickets → plans → implementation → validation → commit"
  - "Observability-Driven Development with OpenTelemetry tracing built in"

